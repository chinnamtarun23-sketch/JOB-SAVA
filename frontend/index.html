<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Builder</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Lucide Icons (similar to what React was using) -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Theme Toggle -->
  <button id="themeToggleBtn" class="theme-toggle-btn btn btn-outline-secondary rounded-circle" title="Toggle Theme">
    <i data-lucide="moon" id="themeIcon"></i>
  </button>

  <div class="container app-container py-5">
    <header class="text-center mb-5">
      <h1 class="display-4 fw-bold">Career Builder</h1>
      <p class="subtitle lead text-muted">AI-Powered Resume Analysis & Job Matching</p>
    </header>

    <div class="glass-panel mx-auto p-4 p-md-5 rounded-4 shadow-lg position-relative" style="max-width: 800px;">
      
      <!-- Setup Section (Input form) -->
      <div id="setupSection">
        <div id="uploadArea" class="upload-area p-5 text-center rounded-3 border-dashed mb-4 cursor-pointer" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept="application/pdf" style="display: none;">
          <i data-lucide="upload-cloud" class="upload-icon mb-3" style="width: 48px; height: 48px;"></i>
          <h3>Drag & Drop your Resume</h3>
          <p class="text-muted mt-2">or click to browse (PDF only)</p>
          
          <div id="fileInfo" class="file-info mt-3 d-none align-items-center justify-content-center fw-medium text-primary">
            <i data-lucide="file-text" class="me-2"></i>
            <span id="fileName"></span>
          </div>
        </div>

        <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

        <button id="submitBtn" class="btn btn-primary btn-lg w-100 d-flex align-items-center justify-content-center" disabled>
          <i data-lucide="search" class="me-2"></i>
          Find Matching Jobs
        </button>
      </div>

      <!-- Loading Section -->
      <div id="loadingSection" class="loader-container text-center py-5 d-none">
        <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="loader-text fs-5 fw-medium">AI Agents are analyzing your profile & scouring the web...</p>
        <p class="text-muted small mt-2">This may take a minute or two.</p>
      </div>

      <!-- Results Section -->
      <div id="resultsSection" class="results-container d-none">
        <h2 class="mb-4" style="color: var(--accent-color);">Your AI Career Analysis</h2>
        <div id="resultsContent" class="results-content markdown-body bg-light p-4 rounded-3 mb-4 shadow-sm">
          <!-- Markdown results will be injected here -->
        </div>
        <button id="resetBtn" class="btn btn-outline-primary btn-lg w-100 d-flex align-items-center justify-content-center">
          <i data-lucide="refresh-cw" class="me-2"></i>
          Analyze Another Resume
        </button>
      </div>

    </div>
  </div>

  <!-- Marked.js for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
